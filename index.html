<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Personal Finance Tracker</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <h1>Personal Finance Tracker</h1>

    <p>Track your expenses and understand your spending.</p>

    <!-- Expense entry form -->
    <h2>Add an Expense</h2>

    <form id="expense-form">
        <label for="description">Description:</label>
        <input type="text" id="description" required>

        <br><br>

        <label for="amount">Amount ($):</label>
        <input
            type="number"
            id="amount"
            min="0.01"
            step="0.01"
            required
        >

        <br><br>

        <label for="category">Category:</label>
        <select id="category" required>
            <option value="">Select a category</option>
            <option value="Food">Food</option>
            <option value="Transportation">Transportation</option>
            <option value="Housing">Housing</option>
            <option value="Entertainment">Entertainment</option>
            <option value="Other">Other</option>
        </select>

        <br><br>

        <label for="date">Date:</label>
        <input type="date" id="date" required>

        <br><br>

        <button type="submit">Add Expense</button>
    </form>

    <!-- Total across all saved expenses -->
    <h2>Total Expenses</h2>
    <p>$<span id="total-expenses">0.00</span></p>

    <!-- Total for the month selected by the user -->
    <h2>Monthly Summary</h2>

    <label for="month">Choose a month:</label>
    <input type="month" id="month">

    <p>Monthly Total: $<span id="monthly-total">0.00</span></p>

    <!-- JavaScript will add expenses to this list -->
    <h2>Expense List</h2>
    <ul id="expense-list"></ul>

    <!-- Connect the JavaScript file -->
    <script src="script.js"></script>
</body>
</html>
